# Manual entry point for building the desktop app out of band -- a probe run
# that cuts no release. The build itself lives in the reusable
# desktop-build.yml, which the tagged release (release.yaml) also calls, so a
# probe here exercises exactly the release path.
#
# Deliberately publishes NO release. `/releases/latest` returns the most recent
# non-prerelease, non-draft release sorted by created_at, regardless of tag
# name, so an extra release from this workflow would shadow the CLI release and
# break both `RDC_RELEASE: latest` in templates/gitlab-ci.yml and the README's
# install instructions. Artifacts are downloadable from the run itself
# (`gh run download <id> -n rdc-desktop-<platform>`).

name: Desktop build (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Label used in the artifact filenames"
        required: false
        default: "probe"

permissions:
  contents: read

jobs:
  desktop:
    name: Build desktop
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit
    with:
      version_label: ${{ inputs.version }}

  # Proves the one mechanism release.yaml depends on that a build alone cannot
  # show: artifacts uploaded by a called workflow's jobs are reachable from the
  # caller's own jobs. Mirrors release.yaml's download step exactly, minus the
  # publish. `always()` so it still reports when one platform failed.
  verify-artifacts:
    name: Verify artifacts reach the caller
    needs: desktop
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          ls -la artifacts/
          count=$(find artifacts -type f | wc -l)
          echo "::notice::$count artifact file(s) visible to the caller"
          if [ "$count" -eq 0 ]; then
            echo "::error::no artifacts reached the caller -- release.yaml would publish CLI assets only"
            exit 1
          fi
