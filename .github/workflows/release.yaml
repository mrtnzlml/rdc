name: Release

on:
  push:
    tags:
      - 'v*'
  # Called directly by weekly-release.yaml. A tag pushed with the default
  # GITHUB_TOKEN does NOT start the `push` trigger above -- GitHub suppresses
  # events raised by that token to prevent recursion -- so the scheduled release
  # has to call this workflow rather than rely on the tag it just wrote.
  # `workflow_call` is not a trigger, so the restriction never applies.
  # Re-drive a release onto a tag that already exists -- the recovery path when
  # the builds succeed but publishing does not, which would otherwise leave a
  # tag with no release behind.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. "v0.8.0".'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: >-
          The release tag to build and publish, e.g. "v0.8.0". Set only by a
          caller; on the tag-push path it is absent and every use below falls
          back to github.ref_name. GitHub's expression docs are explicit that
          dereferencing a nonexistent property yields an empty string, so the
          fallback is exact rather than lucky.
        required: true
        type: string

permissions:
  contents: write

# Serialised against weekly-release.yaml's `prepare` job, which holds the same
# group while it decides and tags. No cancel-in-progress: a release must never
# be killed halfway through publishing.
concurrency:
  group: rdc-release

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # On the call path the run's ref is the caller's (main); pin to the
          # tag so this builds what the tag names. On the tag-push path
          # github.ref is already refs/tags/vX.Y.Z, so this is a no-op.
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Package
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Asset names carry the version so a downloaded tarball identifies
          # itself. templates/gitlab-ci.yml matches on the trailing platform
          # suffix, which keeps working for the pre-0.7 unversioned names too.
          version=${TAG#v}
          src=target/${{ matrix.target }}/release
          mkdir -p dist
          # Pick `rdc.exe` on Windows, `rdc` otherwise.
          binary=rdc
          if [ -f "$src/rdc.exe" ]; then binary=rdc.exe; fi
          tar czf "dist/rdc-$version-${{ matrix.target }}.tar.gz" -C "$src" "$binary"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rdc-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  # The desktop app ships in this same release. Deliberately its own job: a
  # desktop failure must never withhold the CLI binaries -- see `release`'s
  # `if`. Calls the same reusable workflow the manual probe runs, so the
  # verified path and the release path cannot drift.
  build-desktop:
    name: Build desktop
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit
    with:
      version_label: ${{ inputs.tag || github.ref_name }}

  release:
    name: Publish release
    needs: [build, build-desktop]
    # Publish as long as the CLI matrix succeeded, whatever the desktop jobs
    # did. Without `always()` a failed desktop build would skip this job and
    # withhold the CLI tarballs.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # On the call path the run's ref is the caller's (main); pin to the
          # tag so this builds what the tag names. On the tag-push path
          # github.ref is already refs/tags/vX.Y.Z, so this is a no-op.
          ref: ${{ inputs.tag || github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          # MUST be explicit. The action otherwise infers the tag from
          # github.ref, which is a tag ref only on the push path -- on the
          # workflow_call and workflow_dispatch paths it is refs/heads/main and
          # the action fails with "GitHub Releases requires a tag".
          tag_name: ${{ inputs.tag || github.ref_name }}
          # Widened from *.tar.gz to also pick up the desktop .dmg and .zip.
          # The glob still matches the CLI tarballs when the desktop jobs
          # failed, so fail_on_unmatched_files keeps the strength it had.
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  homebrew:
    # Regenerates Formula/rdc.rb in mrtnzlml/homebrew-tap so `brew install
    # mrtnzlml/tap/rdc` resolves to this tag. Requires a repo secret
    # `HOMEBREW_TAP_TOKEN` -- a fine-grained PAT with contents:write on the
    # tap repo only.
    #
    # NOTE: the API-backed download below makes this JOB green and the formula
    # accurate; it does NOT make `brew install mrtnzlml/tap/rdc` work while this
    # repo is private. Homebrew fetches the `url` fields with no token, and that
    # URL 404s (verified directly). Fixing the install needs either a public
    # repo or dropping Homebrew -- a separate decision. The urls stay on the
    # browser path because that is the only form Homebrew understands.
    name: Bump Homebrew tap formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v7
        with:
          repository: mrtnzlml/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Regenerate formula
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          # Two different tokens address two different repos and must not be
          # confused: GH_TOKEN reads assets from THIS repo, HOMEBREW_TAP_TOKEN
          # (used by the checkout step above) writes to the tap repo.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/mrtnzlml/rdc/releases/download/${TAG}"
          # This repo is private, so the releases/download/... browser URL 404s
          # even with a token -- that is what failed the last four releases.
          # `gh release download` resolves the numeric asset id through the API,
          # which is the only way in.
          mkdir -p assets
          gh release download "$TAG" --repo mrtnzlml/rdc --dir assets --clobber \
            --pattern 'rdc-*-aarch64-apple-darwin.tar.gz' \
            --pattern 'rdc-*-x86_64-apple-darwin.tar.gz' \
            --pattern 'rdc-*-x86_64-unknown-linux-gnu.tar.gz'
          sha_of() { sha256sum "assets/$1" | awk '{ print $1 }'; }
          darwin_arm_sha=$(sha_of "rdc-${version}-aarch64-apple-darwin.tar.gz")
          darwin_x86_sha=$(sha_of "rdc-${version}-x86_64-apple-darwin.tar.gz")
          linux_x86_sha=$(sha_of "rdc-${version}-x86_64-unknown-linux-gnu.tar.gz")

          mkdir -p tap/Formula
          cat > tap/Formula/rdc.rb <<RUBY
          class Rdc < Formula
            desc "Rossum Deployment as Code -- CLI for snapshotting and deploying Rossum.ai configurations"
            homepage "https://github.com/mrtnzlml/rdc"
            version "${version}"
            license "WTFPL"

            on_macos do
              on_arm do
                url "${base}/rdc-${version}-aarch64-apple-darwin.tar.gz"
                sha256 "${darwin_arm_sha}"
              end
              on_intel do
                url "${base}/rdc-${version}-x86_64-apple-darwin.tar.gz"
                sha256 "${darwin_x86_sha}"
              end
            end

            on_linux do
              on_intel do
                url "${base}/rdc-${version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${linux_x86_sha}"
              end
            end

            def install
              bin.install "rdc"
              # rdc uses clap_complete's dynamic completions: COMPLETE=<shell> rdc
              # emits the registration script. :clap is Homebrew's predefined
              # format for exactly that protocol (bash/zsh/fish by default).
              generate_completions_from_executable(bin/"rdc", shell_parameter_format: :clap)
              # clap's zsh script only registers the completer (it is written for
              # \`source <(COMPLETE=zsh rdc)\`); autoloaded from fpath as _rdc, the
              # first TAB of a session would no-op. Invoke the completer too.
              (zsh_completion/"_rdc").append_lines "_clap_dynamic_completer_rdc"
            end

            test do
              assert_match "rdc", shell_output("#{bin}/rdc --version")
            end
          end
          RUBY

      - name: Commit and push
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rdc.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "rdc ${TAG}"
          git push
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
