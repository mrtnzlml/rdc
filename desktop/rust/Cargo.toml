[package]
name = "rdc_bridge"
version = "0.1.0"
edition = "2021"

# Own workspace: deliberately does NOT join the parent rdc workspace, which
# sets panic = "abort". flutter_rust_bridge needs unwinding to convert Rust
# panics into Dart exceptions, so the bridge builds with the default unwind.
[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
rdc = { path = "../.." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "io-util", "io-std", "sync", "signal", "parking_lot"] }
trash = "5"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Deliberately sets ONLY `strip` -- `panic` must stay at cargo's default
# (unwind), which is the whole reason this crate is its own workspace.
#
# Measured on the FRB bridge: this shrinks the cdylib 13.7% (12,054,432 ->
# 10,399,312 bytes), which is what Linux (.so) and Windows (.dll) ship. It is a
# NO-OP for macOS, which ships the staticlib: rust_builder/macos's podspec links
# it with `-force_load ${BUILT_PRODUCTS_DIR}/librdc_bridge.a`, so Xcode -- not
# cargo -- performs the final link (the .a moves only 53,419,408 -> 53,405,368).
# Shrinking the macOS binary needs an Xcode-side strip instead; stripping the
# shipped universal framework by hand measured 20.2% (51.7MB -> 41.3MB).
[profile.release]
strip = "symbols"
