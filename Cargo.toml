[package]
name = "rdc"
version = "0.13.0"
edition.workspace = true
description = "Rossum Deployment as Code — CLI for snapshotting and deploying Rossum.ai configurations"
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "rdc"
path = "src/main.rs"

[lib]
name = "rdc"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
deunicode = "1"
flate2 = "1"
fs4 = "1"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
indexmap = { version = "2", features = ["serde"] }
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
notify = "8"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = { version = "0.11", default-features = false }
similar = { version = "3", features = ["inline"] }
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "parking_lot", "rt-multi-thread", "signal"] }
toml = "1"

[dev-dependencies]
assert_cmd = "2"
http = "1"
predicates = "3"
pretty_assertions = "1"
proptest = "1"
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }

# `openpty(3)` for the PTY-driven prompt tests (tests/live/support/pty.rs).
# Already in Cargo.lock through the runtime dependencies.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# On macOS, cargo's dev default is `split-debuginfo = "unpacked"`: the
# per-codegen-unit `.o` files ARE the debuginfo store, so rustc leaves them
# in `target/debug/deps` and nothing ever collects them. Measured on this
# crate: +2,763 orphaned object files per incremental rebuild, and cargo
# scans that directory on every build. One checkout reached 1,091,957 files
# / 128 GB, at which point `touch src/lib.rs && cargo check --all-targets`
# took 104 s (68 s of it kernel time) against 1.8 s in a clean target dir.
#
# `debug = 0` is the only setting that both eliminates the leak and speeds
# builds up: full build 82.7 s -> 44.8 s, target dir -41%, zero orphaned
# objects. Panic backtraces keep their `file:line` (that comes from
# `#[track_caller]` location metadata, not DWARF) and `RUST_BACKTRACE`
# still names every frame; what's gone is lldb source-level stepping.
#
# Need a debugger for an afternoon? Don't edit this line — override it for
# the one command:
#
#   cargo test --config 'profile.dev.debug=2' <filter>
#
# and note that doing so resumes leaking object files for as long as you
# use it. `split-debuginfo = "packed"` keeps lldb working with no leak, but
# runs dsymutil on every build: incremental rebuilds went 8.5 s -> 17.5 s,
# which is why it isn't the default here.
[profile.dev]
debug = 0

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
# Optimize the shipped binary for SIZE, not throughput. Measured 2026-08-27
# with everything else in this profile held fixed: opt-level 3 -> 7332 KB,
# "s" -> 5601 KB, "z" -> 4395 KB (-40%), and the release build itself drops
# 295.7 s -> 160.6 s.
#
# The throughput given up is close to nothing that matters here. rdc's wall
# clock is API pacing, not CPU: a full `tests/cli_sync.rs` run issues 2,491
# requests and spends 2.6 s of user CPU, and against the real API every
# request is paced at 10 req/s. On rdc's own workloads "z" measured -3.2% on
# the snapshot hash/canonicalize path and +0.3% on serde (both noise), and
# +7.4% on a broad mixed run of the 1,151 lib tests.
#
# Revert to `opt-level = 3` if a future CPU-bound path (a big local diff or
# rehash) ever shows up in a profile — it is this one line.
opt-level = "z"

[workspace]
members = ["."]
# The desktop GUI's Rust bridge (desktop/rust, crate `rdc_bridge`) is its own
# workspace so it does not inherit this workspace's panic = "abort"
# (flutter_rust_bridge needs unwinding to convert Rust panics into Dart
# exceptions). It depends on `rdc` via a path dependency.
exclude = ["desktop"]

[workspace.package]
edition = "2024"
license = "WTFPL"

# Compile-time guard against dead code accumulating in the tree. Any
# unused function, struct, enum variant, etc. is a hard error rather
# than a silent warning. Applies to all workspace members.
[workspace.lints.rust]
dead_code = "deny"
