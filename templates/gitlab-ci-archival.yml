# Daily archival sync for one or more Rossum environments managed with rdc.
#
# Copy this file to .gitlab-ci.yml at the root of your Rossum project repo (the
# one that holds rdc.toml + envs/), or `include:` it. Then:
#
#   1. Set CI variables (Settings -> CI/CD -> Variables; masked, protected):
#
#        RDC_USER_<ENV> + RDC_PASS_<ENV>
#            Credentials for every archived env. rdc reads these itself and
#            exchanges them for a token headlessly, so CI needs NO `rdc auth`
#            step. The suffix is the env name uppercased with non-alphanumerics
#            turned into '_':
#              env 'prod'    -> RDC_USER_PROD    / RDC_PASS_PROD
#              env 'prod-eu' -> RDC_USER_PROD_EU / RDC_PASS_PROD_EU
#            `RDC_TOKEN_<ENV>` also works and takes precedence over user+pass.
#
#        RDC_GITHUB_TOKEN
#            Read access to the rdc repo, to download the release asset.
#
#   2. Let the job push a branch and open a merge request: either turn on
#      "Allow Git push requests to this repository" for the CI/CD job token
#      (Settings -> CI/CD -> Token Permissions; GitLab 17.2+), or replace
#      ${CI_JOB_TOKEN} in the push URL with a project/personal access token
#      (stored as a CI variable) that has write access to the repo.
#
#   3. Add a Schedule in Settings -> CI/CD -> Schedules (e.g. '0 2 * * *' UTC),
#      or trigger a run by hand with "Run pipeline" in the GitLab UI.
#
#   4. Adjust RDC_VERSION and the env matrix (parallel.matrix.RDC_ENV) below.
#
# Each run snapshots the live config (read-only on Rossum: `--no-push` never
# writes the tenant) and, when something changed, opens or updates one rolling
# merge request per env for you to review and merge. The default branch is never
# written to directly.

stages:
  - archive

default:
  interruptible: true

variables:
  # Pin to a concrete released tag; never a floating alias. See
  # https://github.com/mrtnzlml/rdc/releases
  RDC_VERSION: "v0.5.0"
  RDC_REPO: "mrtnzlml/rdc"
  RDC_ASSET: "rdc-x86_64-unknown-linux-gnu.tar.gz"

archive:
  stage: archive
  # python:3.12, not alpine: the released Linux binary targets
  # x86_64-unknown-linux-gnu and is dynamically linked against glibc, so it
  # cannot run on Alpine's musl. Not -slim either: the full image already ships
  # git, curl and python3, so the job needs no apt-get and therefore no Debian
  # mirror egress.
  image: python:3.12
  rules:
    # Scheduled run (Settings -> CI/CD -> Schedules)...
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # ...or a manual "Run pipeline" from the GitLab UI.
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    # Full clone: the job force-pushes a branch built on the default branch, and
    # pushing from GitLab's default shallow clone is unreliable.
    GIT_DEPTH: "0"
  # One archival job per environment. A single env still uses the matrix form,
  # so adding more envs is just extending the list (each needs its own
  # RDC_USER_<ENV> / RDC_PASS_<ENV> CI variables), e.g.:
  #   - RDC_ENV: [prod, test, sandbox]
  parallel:
    matrix:
      - RDC_ENV: [prod]
  before_script:
    # Install rdc. The GitHub repo is private, so the browser download URL
    # (releases/download/<tag>/<asset>) returns 404 -- a private asset is only
    # served by the numeric-id assets endpoint, which is why the release is
    # looked up by tag first to resolve that id.
    - |
      set -eu
      : "${RDC_GITHUB_TOKEN:?set RDC_GITHUB_TOKEN (read access to $RDC_REPO)}"
      install_dir=${RDC_INSTALL_DIR:-/usr/local/bin}
      asset_id=$(curl -sSfL -H "Authorization: Bearer $RDC_GITHUB_TOKEN" \
        "https://api.github.com/repos/$RDC_REPO/releases/tags/$RDC_VERSION" \
        | ASSET="$RDC_ASSET" python3 -c 'import json,os,sys; d=json.load(sys.stdin); n=os.environ["ASSET"]; i=[x["id"] for x in d.get("assets",[]) if x["name"]==n]; print(i[0]) if i else sys.exit("no asset named "+n+" in release "+str(d.get("tag_name")))')
      curl -sSfL -H "Authorization: Bearer $RDC_GITHUB_TOKEN" -H "Accept: application/octet-stream" \
        -o /tmp/rdc.tar.gz "https://api.github.com/repos/$RDC_REPO/releases/assets/$asset_id"
      tar -xzf /tmp/rdc.tar.gz -C "$install_dir"
      "$install_dir/rdc" --version
    - git config user.name  "rdc-archive[bot]"
    - git config user.email "rdc-archive@noreply"
  script:
    # Snapshot the env's live config into the working tree (never writes Rossum).
    #
    # --conflict use-remote is what makes the snapshot trustworthy. When the
    # committed snapshot and the tenant have both moved since the last sync, the
    # default non-TTY behavior parks the remote side under .rdc/conflicts/<env>/
    # and leaves the local file untouched -- so the archive would quietly NOT
    # record the live state of that object. An archive exists to record what is
    # live, so the remote always wins here.
    - rdc sync "$RDC_ENV" --no-push --yes --conflict use-remote
    - |
      set -eu
      # Paths are scoped on purpose: it keeps the login token rdc caches in
      # secrets/ out of the commit even if that directory is not gitignored.
      git add -A -- "envs/$RDC_ENV"
      if [ -f ".rdc/state/$RDC_ENV.lock.json" ]; then
        git add -- ".rdc/state/$RDC_ENV.lock.json"
      fi
      if git diff --cached --quiet; then
        echo "No changes in $RDC_ENV; nothing to archive."
        exit 0
      fi
      # One rolling MR per env: (re)point a stable branch at the current default
      # branch plus a single up-to-date snapshot commit, then force-push. The MR
      # always shows the true diff against $CI_DEFAULT_BRANCH even after the
      # default branch moves on, and a later run updates that same open MR.
      # When the MR is merged the source branch is removed, so the next change
      # opens a fresh one.
      BRANCH="archive/$RDC_ENV"
      git checkout -B "$BRANCH"
      git commit -m "chore(archive): $RDC_ENV snapshot ($(date -u +%Y-%m-%d))"
      git push --force \
        -o merge_request.create \
        -o merge_request.target="$CI_DEFAULT_BRANCH" \
        -o merge_request.title="chore(archive): $RDC_ENV snapshot" \
        -o merge_request.remove_source_branch \
        "https://oauth2:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        "HEAD:refs/heads/$BRANCH"

# NOTE: if you also run gitlab-ci-deploy.yml, do not archive an env that is a
# deploy TARGET of the same repo without thinking it through. Merging an
# archival snapshot of a target env rewrites that env's committed snapshot, and
# the next deploy re-derives it from its source anyway -- archive the head of
# the promotion chain (dev) and the tenants nothing deploys to.
