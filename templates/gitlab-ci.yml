# One GitLab CI pipeline for a Rossum project managed with rdc:
#
#   * archive — scheduled, read-only against Rossum (`sync --no-push`). Records
#     what is live in the tenant and commits the snapshot back to the default
#     branch. One job per archived env.
#   * deploy — one manual "button" per promoted env. Mirrors its SOURCE env's
#     committed snapshot onto the TARGET env with `rdc migrate --mirror`
#     (pure-local, zero remote calls), pushes the result to the target tenant
#     with `rdc sync`, then commits back what rdc wrote: server-assigned
#     ids/urls and the regenerated _index.md land in envs/<env>/, refreshed
#     base hashes in that env's lockfile, slug divergences in .rdc/mapping.toml.
#
# Copy this file to .gitlab-ci.yml at the root of your Rossum project repo (the
# one that holds rdc.toml + envs/), or `include:` it. Then:
#
#   1. Set CI variables (Settings -> CI/CD -> Variables; masked, protected):
#
#        RDC_USER_<ENV> + RDC_PASS_<ENV>
#            Credentials for every env this pipeline touches -- archived or
#            deployed to. rdc reads these itself and exchanges them for a token
#            headlessly, so CI needs NO `rdc auth` step. The suffix is the env
#            name uppercased with non-alphanumerics turned into '_':
#              env 'prod'    -> RDC_USER_PROD    / RDC_PASS_PROD
#              env 'prod-eu' -> RDC_USER_PROD_EU / RDC_PASS_PROD_EU
#            `RDC_TOKEN_<ENV>` also works and takes precedence over user+pass.
#
#        RDC_GITHUB_TOKEN
#            Read access to the rdc repo, to download the release asset.
#
#        RDC_GIT_PUSH_TOKEN
#            Write access to THIS repo, for the commit-back push. Both stages
#            commit to the default branch, so the token must be allowed to push
#            to it (add it to the protected branch's allowed-to-push list).
#            Alternatively set RDC_GIT_PUSH_URL to a complete authenticated
#            remote URL.
#
#   2. Adjust RDC_VERSION, RDC_GIT_EMAIL, the archive env matrix, and the
#      concrete deploy jobs at the bottom of this file.
#
#   3. Add a Schedule for the archive in Settings -> CI/CD -> Schedules
#      (e.g. '0 2 * * *' UTC), or trigger a run by hand with "Run pipeline".
#
#   4. Rehearse every new deploy target locally BEFORE its first press:
#        rdc migrate <src> <tgt> --mirror --dry-run
#        rdc sync <tgt> --dry-run
#
# CAUTION: the deploy jobs write to Rossum and CAN DELETE. `migrate --mirror`
# removes target snapshot objects the source no longer has, and
# `sync --allow-deletes` turns those local removals into remote DELETEs. Keep
# the chain's SOURCE envs (e.g. dev) out of the deploy jobs: they are authored
# by hand from a workstation and are the head of the chain, never a target of it.
# Archive those instead -- archiving an env that is also a deploy target only
# rewrites a snapshot the next deploy re-derives from its source anyway.

stages:
  - test
  - archive
  - deploy

default:
  interruptible: true

variables:
  # Pin to a concrete released tag; never a floating alias. See
  # https://github.com/mrtnzlml/rdc/releases
  RDC_VERSION: "v0.5.0"
  RDC_REPO: "mrtnzlml/rdc"
  RDC_ASSET: "rdc-x86_64-unknown-linux-gnu.tar.gz"
  # Author + committer address for the commit-back. GitLab push rules can
  # require these to match a pattern ("Check whether the commit author is a
  # GitLab user", "Commit author's email"); if yours does, use an address that
  # satisfies it or the push is rejected after rdc has already run.
  RDC_GIT_EMAIL: "rdc-ci@example.com"

# Install rdc. The GitHub repo is private, so the browser download URL
# (releases/download/<tag>/<asset>) 404s even with a token -- github.com serves
# release downloads to a browser session only. api.github.com plus the numeric
# asset id is the only way in, which is why the release is looked up by tag
# first to resolve that id.
.rdc-install-script: &rdc-install-script |
  set -eu
  : "${RDC_GITHUB_TOKEN:?set RDC_GITHUB_TOKEN (read access to $RDC_REPO)}"
  install_dir=${RDC_INSTALL_DIR:-/usr/local/bin}
  auth="Authorization: Bearer $RDC_GITHUB_TOKEN"
  case "$RDC_VERSION" in v*) tag=$RDC_VERSION ;; *) tag=v$RDC_VERSION ;; esac
  release=$(curl -sSfL -H "$auth" "https://api.github.com/repos/$RDC_REPO/releases/tags/$tag")
  asset_id=$(printf '%s' "$release" | ASSET=$RDC_ASSET python3 -c 'import json,os,sys; print(*[a["id"] for a in json.load(sys.stdin)["assets"] if a["name"]==os.environ["ASSET"]])')
  : "${asset_id:?no asset named $RDC_ASSET in release $tag}"
  curl -sSfL -H "$auth" -H "Accept: application/octet-stream" \
    "https://api.github.com/repos/$RDC_REPO/releases/assets/$asset_id" \
    | tar -xz -C "$install_dir"
  "$install_dir/rdc" --version

# Commit what rdc wrote to the default branch. before_script and script share
# one shell, so defining the function in before_script makes it callable from
# script; both the archive and the deploy jobs do exactly that.
.rdc-writeback: &rdc-writeback |
  writeback() {
    msg=$1
    remote=${RDC_GIT_PUSH_URL:-https://oauth2:$RDC_GIT_PUSH_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git}
    # Paths are scoped on purpose: it keeps the login token rdc caches in
    # secrets/ out of the commit even if that directory is not gitignored.
    set -- "envs/$RDC_ENV"
    for p in ".rdc/state/$RDC_ENV.lock.json" ".rdc/mapping.toml" ".rdc/map"; do
      if [ -e "$p" ]; then set -- "$@" "$p"; fi
    done
    git add -A -- "$@" || return 1
    if git diff --cached --quiet; then
      echo "$RDC_ENV: nothing to commit back."
      return 0
    fi
    git commit -q -m "$msg" || return 1
    git fetch -q "$remote" "$CI_DEFAULT_BRANCH" || return 1
    git rebase -q --autostash FETCH_HEAD || return 1
    # ci.skip: this pushes to the branch the job runs on, and the pipeline that
    # would start cancels this one and its queued sibling.
    git push -q -o ci.skip "$remote" "HEAD:refs/heads/$CI_DEFAULT_BRANCH"
  }

# EXAMPLE placeholder for your repo's own checks (hook unit tests, linters).
# The deploy buttons depend on it so a deploy cannot run against a snapshot that
# failed validation. If your repo has no tests, delete this job AND the
# `needs:` in .rdc-deploy below.
pytest:
  stage: test
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - pip install --no-cache-dir -r requirements-dev.txt
  script:
    - pytest -q

archive:
  stage: archive
  # python:3.12, not alpine: the released Linux binary targets
  # x86_64-unknown-linux-gnu and is dynamically linked against glibc, so it
  # cannot run on Alpine's musl. Not -slim either: the full image already ships
  # git, curl and python3, so the job needs no apt-get and therefore no Debian
  # mirror egress.
  image: python:3.12
  needs: []  # an archive records what is live; never gate it on the tests
  # Both matrix legs push to the default branch, and every archive pipeline
  # does. One resource group serializes them all, so no two commit-backs race.
  resource_group: archive
  interruptible: false  # a newer pipeline must not cancel the queued sibling
  rules:
    # Scheduled run (Settings -> CI/CD -> Schedules)...
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # ...or a manual "Run pipeline" from the GitLab UI.
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    # Full clone: the commit-back rebases onto the default branch, and pushing
    # from GitLab's default shallow clone is unreliable.
    GIT_DEPTH: "0"
  # One archival job per environment. A single env still uses the matrix form,
  # so adding more envs is just extending the list (each needs its own
  # RDC_USER_<ENV> / RDC_PASS_<ENV> CI variables).
  parallel:
    matrix:
      - RDC_ENV: [dev]
  before_script:
    - *rdc-install-script
    - *rdc-writeback
    - git config user.name "rdc-archive[bot]"
    - git config user.email "$RDC_GIT_EMAIL"
  script:
    # Snapshot the env's live config into the working tree (never writes Rossum).
    #
    # --conflict use-remote is what makes the snapshot trustworthy. When the
    # committed snapshot and the tenant have both moved since the last sync, the
    # default non-TTY behavior parks the remote side under .rdc/conflicts/<env>/
    # and leaves the local file untouched -- so the archive would quietly NOT
    # record the live state of that object. An archive exists to record what is
    # live, so the tenant always wins here.
    - rdc sync "$RDC_ENV" --no-push --yes --conflict use-remote
    - |
      set -eu
      if ! writeback "chore(archive): $RDC_ENV snapshot ($(date -u +%Y-%m-%d))"; then
        echo "ERROR: could not commit the $RDC_ENV archive back; see the git output above" >&2
        echo "(default branch moved, or a push rule rejected the commit)." >&2
        echo "Nothing was written to Rossum; fix the cause and re-run -- it re-snapshots." >&2
        exit 1
      fi

# Shared setup for every deploy button.
.rdc-deploy:
  stage: deploy
  image: python:3.12  # glibc binary: not alpine, not -slim (see `archive`)
  needs: ["pytest"]
  # A deploy that writes to a tenant must never be auto-cancelled mid-run by a
  # newer pipeline.
  interruptible: false
  rules:
    # `when: manual` lives INSIDE `rules`: a matching rule without its own
    # `when` falls back to on_success, which would deploy on every push.
    #
    # allow_failure: true keeps the pipeline green while a button is unpressed.
    # The trade-off is that a broken deploy does not turn the pipeline red; set
    # it to false if you would rather see that, and accept that an unpressed
    # button leaves the pipeline in the "blocked" state.
    #
    # A scheduled archive pipeline also runs on the default branch, so these
    # buttons show up there too (unpressed, harmless). Add
    # `$CI_PIPELINE_SOURCE != "schedule"` to the condition to hide them.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  variables:
    # Full clone: the commit-back rebases onto the default branch.
    GIT_DEPTH: "0"
    # How sync resolves an object that moved BOTH locally and in the tenant.
    # keep-local: the committed snapshot wins and overwrites the tenant edit,
    # unattended. Empty: halt on divergence instead (the check at the end of
    # the script turns the parked conflict shadows into a job failure).
    RDC_CONFLICT: keep-local
  before_script:
    - *rdc-install-script
    - *rdc-writeback
    - git config user.name "rdc-ci"
    - git config user.email "$RDC_GIT_EMAIL"
  script:
    - |
      set -eu
      shadow_dir=".rdc/conflicts/$RDC_ENV"

      # Drop any conflict shadow left behind by an earlier run. The tree is
      # gitignored, so it never arrives via the clone, but a reused or cached
      # workspace can still carry one -- and a stale shadow makes rdc skip that
      # object indefinitely, besides tripping the divergence check below.
      rm -rf "$shadow_dir"

      # Promote the source snapshot onto the target, locally.
      rdc migrate "$RDC_SRC" "$RDC_ENV" --mirror --yes

      # Push it to the tenant. Capture the status instead of letting `set -e`
      # abort: sync may have written part of the tenant before failing, and
      # those writes must be committed back before the job exits, or the repo
      # silently falls behind the tenant.
      rc=0
      rdc sync "$RDC_ENV" --allow-deletes --yes ${RDC_CONFLICT:+--conflict "$RDC_CONFLICT"} || rc=$?

      # A rebase or push failure here happens AFTER the tenant was written, so
      # say so plainly: the fix is to reconcile the repo, not to re-deploy.
      if ! writeback "ci: deploy $RDC_ENV (pipeline ${CI_PIPELINE_ID:-n/a})"; then
        echo "ERROR: $RDC_ENV WAS deployed, but committing the result back failed." >&2
        echo "The tenant is ahead of this repo. Run 'rdc sync $RDC_ENV' locally and commit." >&2
        exit 1
      fi

      if [ "$rc" -ne 0 ]; then
        echo "ERROR: rdc sync failed for $RDC_ENV (exit $rc); anything it did write is committed." >&2
        exit "$rc"
      fi

      # Fail on remote divergence. With --yes (or any non-TTY) and no
      # --conflict, a BothDiverged conflict does NOT abort sync: it parks the
      # remote side under .rdc/conflicts/<env>/, leaves that object unpushed,
      # and exits 0. Left unchecked the job would go green having silently
      # skipped objects, so treat any shadow as a deploy failure.
      if [ -n "$(find "$shadow_dir" -type f -print -quit 2>/dev/null)" ]; then
        echo "ERROR: $RDC_ENV diverged remotely; these objects were NOT deployed:" >&2
        find "$shadow_dir" -type f | sed "s|^$shadow_dir/|  |" | sort >&2
        echo >&2
        echo "The target tenant was edited outside rdc since its last sync. Resolve locally with" >&2
        echo "  rdc sync $RDC_ENV        # interactive conflict resolver" >&2
        echo "then commit the result and press this button again, or set RDC_CONFLICT back to" >&2
        echo "keep-local so the committed snapshot overwrites the tenant edit unattended." >&2
        exit 1
      fi

# ---------------------------------------------------------------------------
# The promotion chain: dev (authored by hand, archived above) -> test -> prod.
#
# `resource_group` serializes every pipeline that deploys the same env, so two
# runs can never interleave writes into one tenant. `environment` records the
# deployment under Operate -> Environments.
#
# Add more targets by repeating the pattern, one job per env, each with its own
# resource_group and RDC_USER_<ENV> / RDC_PASS_<ENV> variables.
# ---------------------------------------------------------------------------

deploy:test:
  extends: .rdc-deploy
  resource_group: test
  environment:
    name: test
  variables:
    RDC_ENV: test
    RDC_SRC: dev

deploy:prod:
  extends: .rdc-deploy
  resource_group: prod
  environment:
    name: prod
  variables:
    RDC_ENV: prod
    RDC_SRC: test
