# GitLab CI for a Rossum project managed with rdc: a scheduled, read-only
# archive per tenant, plus one manual deploy button per promoted env. Copy to
# .gitlab-ci.yml, fill in the TODOs, add a Schedule for the archive (Settings ->
# CI/CD -> Schedules), and set these masked + protected CI variables:
#   RDC_USER_<ENV> + RDC_PASS_<ENV>  one pair per env below; rdc exchanges them
#     for a token itself, so CI needs no `rdc auth`. RDC_TOKEN_<ENV> also works.
#     <ENV> is the env name uppercased, non-alphanumerics as '_' (dev-eu -> DEV_EU).
#   RDC_GITHUB_TOKEN                 read access to the rdc repo (release asset).
#   RDC_GIT_PUSH_TOKEN               write access to THIS repo's default branch
#     for the commit-back, or RDC_GIT_PUSH_URL with a full authenticated URL.
#
# Rehearse every new deploy target before its first press:
#   rdc migrate <src> <tgt> --mirror --dry-run && rdc sync <tgt> --dry-run
#
# CAUTION: deploy writes to Rossum and CAN DELETE -- `migrate --mirror` prunes
# target objects the source no longer has, and `sync --allow-deletes` turns
# those into remote DELETEs. Keep hand-authored source envs (dev) out of the
# deploy jobs; archive those instead.

stages:
  - test
  - archive
  - deploy

default:
  interruptible: true

variables:
  RDC_VERSION: "v0.5.0"  # TODO: a released tag, never a floating alias
  RDC_REPO: "mrtnzlml/rdc"
  RDC_ASSET: "rdc-x86_64-unknown-linux-gnu.tar.gz"
  # Commit-back author and committer. GitLab push rules can require these to
  # match a pattern; if yours does, use an address that satisfies it.
  RDC_GIT_EMAIL: "rdc-ci@example.com"  # TODO

# github.com serves release downloads to a browser session only: that URL 404s
# even with a token. api.github.com + the numeric asset id is the only way in.
.rdc-install-script: &rdc-install-script |
  set -eu
  : "${RDC_GITHUB_TOKEN:?set RDC_GITHUB_TOKEN (read access to $RDC_REPO)}"
  install_dir=${RDC_INSTALL_DIR:-/usr/local/bin}
  auth="Authorization: Bearer $RDC_GITHUB_TOKEN"
  case "$RDC_VERSION" in v*) tag=$RDC_VERSION ;; *) tag=v$RDC_VERSION ;; esac
  release=$(curl -sSfL -H "$auth" "https://api.github.com/repos/$RDC_REPO/releases/tags/$tag")
  asset_id=$(printf '%s' "$release" | ASSET=$RDC_ASSET python3 -c 'import json,os,sys; print(*[a["id"] for a in json.load(sys.stdin)["assets"] if a["name"]==os.environ["ASSET"]])')
  : "${asset_id:?no asset named $RDC_ASSET in release $tag}"
  curl -sSfL -H "$auth" -H "Accept: application/octet-stream" \
    "https://api.github.com/repos/$RDC_REPO/releases/assets/$asset_id" \
    | tar -xz -C "$install_dir"
  "$install_dir/rdc" --version

# Commits what rdc wrote to the default branch. before_script and script share
# one shell, so both jobs call this.
.rdc-writeback: &rdc-writeback |
  writeback() {
    msg=$1
    remote=${RDC_GIT_PUSH_URL:-https://oauth2:$RDC_GIT_PUSH_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git}
    # Scoped paths keep the token rdc caches in secrets/ out of the commit.
    set -- "envs/$RDC_ENV"
    for p in ".rdc/state/$RDC_ENV.lock.json" ".rdc/mapping.toml" ".rdc/map"; do
      if [ -e "$p" ]; then set -- "$@" "$p"; fi
    done
    git add -A -- "$@" || return 1
    if git diff --cached --quiet; then
      echo "$RDC_ENV: nothing to commit back."
      return 0
    fi
    git commit -q -m "$msg" || return 1
    git fetch -q "$remote" "$CI_DEFAULT_BRANCH" || return 1
    git rebase -q --autostash FETCH_HEAD || return 1
    # ci.skip: this pushes to the branch the job runs on, and the pipeline that
    # would start cancels this one and its queued sibling.
    git push -q -o ci.skip "$remote" "HEAD:refs/heads/$CI_DEFAULT_BRANCH"
  }

# EXAMPLE placeholder for your repo's own checks. The deploy buttons depend on
# it, so a deploy cannot run against a snapshot that failed validation. No tests
# in this repo? Delete this job AND the `needs:` in .rdc-deploy.
pytest:
  stage: test
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - pip install --no-cache-dir -r requirements-dev.txt
  script:
    - pytest -q

archive:
  stage: archive
  image: python:3.12  # glibc binary: not alpine (musl); not -slim (needs git, curl, python3)
  needs: []  # an archive records what is live; never gate it on the tests
  resource_group: archive  # serialize the commit-backs, including across pipelines
  interruptible: false  # a newer pipeline must not cancel the queued sibling
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    GIT_DEPTH: "0"  # the commit-back rebases onto the default branch
  parallel:
    matrix:
      - RDC_ENV: [dev]  # TODO: the envs to archive
  before_script:
    - *rdc-install-script
    - *rdc-writeback
    - git config user.name "rdc-archive[bot]"
    - git config user.email "$RDC_GIT_EMAIL"
  script:
    # use-remote: the tenant wins, or the archive silently omits diverged objects.
    - rdc sync "$RDC_ENV" --no-push --yes --conflict use-remote
    - |
      set -eu
      if ! writeback "chore(archive): $RDC_ENV snapshot ($(date -u +%Y-%m-%d))"; then
        echo "ERROR: could not commit the $RDC_ENV archive back; see the git output above" >&2
        echo "(default branch moved, or a push rule rejected the commit)." >&2
        echo "Nothing was written to Rossum; fix the cause and re-run -- it re-snapshots." >&2
        exit 1
      fi

.rdc-deploy:
  stage: deploy
  image: python:3.12  # glibc binary (see `archive`)
  needs: ["pytest"]
  interruptible: false  # never cancel a job mid tenant write
  rules:
    # `when: manual` belongs INSIDE `rules`: a matching rule without it falls
    # back to on_success and would deploy on every push. allow_failure keeps the
    # pipeline green while a button is unpressed; set it to false to have a
    # broken deploy turn the pipeline red (unpressed buttons then block it).
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  variables:
    GIT_DEPTH: "0"
    # How sync resolves an object edited BOTH locally and in the tenant.
    # keep-local: the committed snapshot overwrites the tenant edit, unattended.
    # Empty: halt on divergence (the shadow check below fails the job).
    RDC_CONFLICT: keep-local
  before_script:
    - *rdc-install-script
    - *rdc-writeback
    - git config user.name "rdc-ci"
    - git config user.email "$RDC_GIT_EMAIL"
  script:
    - |
      set -eu
      shadow_dir=".rdc/conflicts/$RDC_ENV"
      # The tree is gitignored, so it never arrives via the clone -- but a reused
      # workspace can carry one, and a stale shadow makes rdc skip that object
      # indefinitely, besides tripping the divergence check below.
      rm -rf "$shadow_dir"

      rdc migrate "$RDC_SRC" "$RDC_ENV" --mirror --yes

      # Keep the status instead of letting `set -e` abort: sync may have written
      # part of the tenant before failing, and that must be committed back
      # before the job exits, or the repo silently falls behind the tenant.
      rc=0
      rdc sync "$RDC_ENV" --allow-deletes --yes ${RDC_CONFLICT:+--conflict "$RDC_CONFLICT"} || rc=$?

      # A failure here happens AFTER the tenant was written: the fix is to
      # reconcile the repo, not to re-deploy.
      if ! writeback "ci: deploy $RDC_ENV (pipeline ${CI_PIPELINE_ID:-n/a})"; then
        echo "ERROR: $RDC_ENV WAS deployed, but committing the result back failed." >&2
        echo "The tenant is ahead of this repo. Run 'rdc sync $RDC_ENV' locally and commit." >&2
        exit 1
      fi

      if [ "$rc" -ne 0 ]; then
        echo "ERROR: rdc sync failed for $RDC_ENV (exit $rc); anything it did write is committed." >&2
        exit "$rc"
      fi

      # Without --conflict, a diverged object does NOT abort sync: its remote
      # side is parked under .rdc/conflicts/<env>/, it stays unpushed, and sync
      # still exits 0. Treat any shadow as a deploy failure.
      if [ -n "$(find "$shadow_dir" -type f -print -quit 2>/dev/null)" ]; then
        echo "ERROR: $RDC_ENV diverged remotely; these objects were NOT deployed:" >&2
        find "$shadow_dir" -type f | sed "s|^$shadow_dir/|  |" | sort >&2
        echo >&2
        echo "The target tenant was edited outside rdc since its last sync. Resolve locally with" >&2
        echo "  rdc sync $RDC_ENV        # interactive conflict resolver" >&2
        echo "then commit the result and press this button again, or set RDC_CONFLICT back to" >&2
        echo "keep-local so the committed snapshot overwrites the tenant edit unattended." >&2
        exit 1
      fi

# The promotion chain. `resource_group` serializes every pipeline that deploys
# the same env, so two runs can never interleave writes into one tenant;
# `environment` records the deployment under Operate -> Environments.
deploy:test:  # TODO: one job per target env, source -> target
  extends: .rdc-deploy
  resource_group: test
  environment:
    name: test
  variables:
    RDC_ENV: test
    RDC_SRC: dev

deploy:prod:
  extends: .rdc-deploy
  resource_group: prod
  environment:
    name: prod
  variables:
    RDC_ENV: prod
    RDC_SRC: test
