[pytest]
# Where tests may live: `tests/` for your own (the conventional home), `envs/`
# for a test kept beside the snapshot it exercises (but not inside a `hooks/`,
# `rules/` or `formulas/` folder -- see `norecursedirs` below), `testkit/` for
# the harness's own self-tests. A missing entry is fine -- pytest just collects
# the others.
testpaths = tests envs testkit
python_files = test_*.py
# Formula sidecars are named after the tenant's schema ids, so a field called
# `test_flag` is written to `formulas/test_flag.py` and matches python_files
# above. They are INPUTS to tests, not tests: importing one raises NameError on
# the formula helpers (`default_to`, ...) and one such field would fail the
# whole run -- including the deploy buttons that gate on this job.
addopts = --ignore-glob=*/formulas/*
# Never enter the folders holding the tenant's code. pytest runs a folder's
# `conftest.py` while collecting it, tests or not, and those files are named
# after hooks, rules and fields in Rossum -- so a `conftest` there would run in
# this job. The first five entries are pytest's own defaults.
norecursedirs = .* build dist venv *.egg hooks rules formulas
