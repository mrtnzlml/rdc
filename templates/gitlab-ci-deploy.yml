# Promotion + deploy pipeline for Rossum environments managed with rdc.
#
# Companion to gitlab-ci-archival.yml. One manual "button" per promoted
# environment. Each job mirrors its SOURCE env's committed snapshot onto the
# TARGET env with `rdc migrate --mirror` (pure-local, zero remote calls), pushes
# the result to the target tenant with `rdc sync`, then commits back what rdc
# wrote: server-assigned ids/urls and the regenerated _index.md land in
# envs/<env>/, refreshed base hashes in that env's lockfile.
#
# Copy this file to .gitlab-ci.yml at the root of your Rossum project repo
# (the one with rdc.toml + envs/), or `include:` it. Then:
#
#   1. Set CI variables (Settings -> CI/CD -> Variables; masked, protected):
#
#        RDC_USER_<ENV> + RDC_PASS_<ENV>
#            Credentials for every env you deploy TO. rdc reads these itself
#            and exchanges them for a token headlessly, so CI needs NO
#            `rdc auth` step. The suffix is the env name uppercased with
#            non-alphanumerics turned into '_':
#              env 'test'    -> RDC_USER_TEST    / RDC_PASS_TEST
#              env 'prod-eu' -> RDC_USER_PROD_EU / RDC_PASS_PROD_EU
#            `RDC_TOKEN_<ENV>` also works and takes precedence over user+pass.
#
#        RDC_GITHUB_TOKEN
#            Read access to the rdc repo, to download the release asset.
#
#        RDC_GIT_PUSH_TOKEN
#            Write access to THIS repo, for the commit-back push. It must be
#            allowed to push to the default branch (add it to the protected
#            branch's allowed-to-push list). Alternatively set RDC_GIT_PUSH_URL
#            to a complete authenticated remote URL.
#
#   2. Adjust the env chain in the concrete jobs at the bottom of this file.
#
#   3. Rehearse every new target locally BEFORE its first press:
#        rdc migrate <src> <tgt> --mirror --dry-run
#        rdc sync <tgt> --dry-run
#
# CAUTION: these jobs write to Rossum and CAN DELETE. `migrate --mirror` removes
# target snapshot objects the source no longer has, and `sync --allow-deletes`
# turns those local removals into remote DELETEs. Keep the chain's SOURCE envs
# (e.g. dev) out of this file: they are authored by hand from a workstation and
# are the head of the chain, never a target of it.

stages:
  - deploy

default:
  interruptible: true

variables:
  # Pin to a concrete released tag; never a floating alias. See
  # https://github.com/mrtnzlml/rdc/releases
  RDC_VERSION: "v0.5.0"
  RDC_REPO: "mrtnzlml/rdc"
  RDC_ASSET: "rdc-x86_64-unknown-linux-gnu.tar.gz"

# Shared setup for every deploy button.
.rdc-deploy:
  stage: deploy
  # python:3.12, not alpine: the released Linux binary targets
  # x86_64-unknown-linux-gnu and is dynamically linked against glibc, so it
  # cannot run on Alpine's musl. Not -slim either: the full image already ships
  # git, curl and python3, so the job needs no apt-get and therefore no Debian
  # mirror egress.
  image: python:3.12
  # A deploy that writes to a tenant must never be auto-cancelled mid-run by a
  # newer pipeline.
  interruptible: false
  rules:
    # `when: manual` lives INSIDE `rules`: a matching rule without its own
    # `when` falls back to on_success, which would deploy on every push.
    #
    # allow_failure: false makes a broken deploy turn the pipeline red. The
    # trade-off is that an unpressed button leaves the pipeline in the "blocked"
    # state; set it to true if you would rather have green pipelines and accept
    # that a failed deploy is not reflected in the pipeline status.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
  variables:
    # Full clone: the commit-back rebases onto the default branch.
    GIT_DEPTH: "0"
  before_script:
    # Install rdc. The GitHub repo is private, so the browser download URL
    # (releases/download/<tag>/<asset>) returns 404 -- a private asset is only
    # served by the numeric-id assets endpoint, which is why the release is
    # looked up by tag first to resolve that id.
    - |
      set -eu
      : "${RDC_GITHUB_TOKEN:?set RDC_GITHUB_TOKEN (read access to $RDC_REPO)}"
      install_dir=${RDC_INSTALL_DIR:-/usr/local/bin}
      asset_id=$(curl -sSfL -H "Authorization: Bearer $RDC_GITHUB_TOKEN" \
        "https://api.github.com/repos/$RDC_REPO/releases/tags/$RDC_VERSION" \
        | ASSET="$RDC_ASSET" python3 -c 'import json,os,sys; d=json.load(sys.stdin); n=os.environ["ASSET"]; i=[x["id"] for x in d.get("assets",[]) if x["name"]==n]; print(i[0]) if i else sys.exit("no asset named "+n+" in release "+str(d.get("tag_name")))')
      curl -sSfL -H "Authorization: Bearer $RDC_GITHUB_TOKEN" -H "Accept: application/octet-stream" \
        -o /tmp/rdc.tar.gz "https://api.github.com/repos/$RDC_REPO/releases/assets/$asset_id"
      tar -xzf /tmp/rdc.tar.gz -C "$install_dir"
      "$install_dir/rdc" --version
  script:
    - |
      set -eu
      remote=${RDC_GIT_PUSH_URL:-https://oauth2:$RDC_GIT_PUSH_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git}
      export GIT_AUTHOR_NAME=rdc-ci GIT_AUTHOR_EMAIL=rdc-ci@$CI_SERVER_HOST
      export GIT_COMMITTER_NAME=$GIT_AUTHOR_NAME GIT_COMMITTER_EMAIL=$GIT_AUTHOR_EMAIL
      shadow_dir=".rdc/conflicts/$RDC_ENV"

      # Drop any conflict shadow left behind by an earlier run. The tree is
      # gitignored, so it never arrives via the clone, but a reused or cached
      # workspace can still carry one -- and a stale shadow makes rdc skip that
      # object indefinitely, besides tripping the divergence check below.
      rm -rf "$shadow_dir"

      # Promote the source snapshot onto the target, locally.
      rdc migrate "$RDC_SRC" "$RDC_ENV" --mirror --yes

      # Push it to the tenant. Capture the status instead of letting `set -e`
      # abort: sync may have written part of the tenant before failing, and
      # those writes must be committed back before the job exits, or the repo
      # silently falls behind the tenant.
      rc=0
      rdc sync "$RDC_ENV" --allow-deletes --yes || rc=$?

      # Commit back whatever rdc wrote. Paths are scoped on purpose: it keeps
      # the login token rdc caches in secrets/ out of the commit even if that
      # directory is not gitignored.
      git add -A -- "envs/$RDC_ENV"
      if [ -f ".rdc/state/$RDC_ENV.lock.json" ]; then
        git add -- ".rdc/state/$RDC_ENV.lock.json"
      fi
      if git diff --cached --quiet; then
        echo "Nothing to commit back for $RDC_ENV."
      else
        git commit -q -m "ci: deploy $RDC_ENV (pipeline ${CI_PIPELINE_ID:-n/a})"
        git fetch -q "$remote" "$CI_DEFAULT_BRANCH"
        # A rebase or push failure here happens AFTER the tenant was written,
        # so say so plainly: the fix is to reconcile the repo, not to re-deploy.
        if ! git rebase -q --autostash FETCH_HEAD \
          || ! git push -q "$remote" "HEAD:refs/heads/$CI_DEFAULT_BRANCH"; then
          echo "ERROR: $RDC_ENV WAS deployed, but committing the result back failed." >&2
          echo "The tenant is ahead of this repo. Run 'rdc sync $RDC_ENV' locally and commit." >&2
          exit 1
        fi
      fi

      if [ "$rc" -ne 0 ]; then
        echo "ERROR: rdc sync failed for $RDC_ENV (exit $rc); anything it did write is committed." >&2
        exit "$rc"
      fi

      # Fail on remote divergence. With --yes (or any non-TTY), a BothDiverged
      # conflict does NOT abort sync: it parks the remote side under
      # .rdc/conflicts/<env>/, leaves that object unpushed, and exits 0. Left
      # unchecked the job would go green having silently skipped objects, so
      # treat any shadow as a deploy failure and let a human decide.
      if [ -d "$shadow_dir" ] && [ -n "$(find "$shadow_dir" -type f -print -quit)" ]; then
        echo "ERROR: $RDC_ENV diverged remotely; these objects were NOT deployed:" >&2
        find "$shadow_dir" -type f | sed "s|^$shadow_dir/|  |" | sort >&2
        echo >&2
        echo "The target tenant was edited outside rdc since its last sync. Resolve locally with" >&2
        echo "  rdc sync $RDC_ENV        # interactive conflict resolver" >&2
        echo "then commit the result and press this button again. To make CI resolve divergence" >&2
        echo "automatically instead, add --conflict keep-local to the sync above (the committed" >&2
        echo "snapshot then always wins and overwrites the remote edit)." >&2
        exit 1
      fi

# ---------------------------------------------------------------------------
# The promotion chain: dev (authored by hand) -> test -> prod.
#
# `resource_group` serializes every pipeline that deploys the same env, so two
# runs can never interleave writes into one tenant. `environment` records the
# deployment under Operate -> Environments.
# ---------------------------------------------------------------------------

deploy:test:
  extends: .rdc-deploy
  resource_group: test
  environment:
    name: test
  variables:
    RDC_ENV: test
    RDC_SRC: dev

deploy:prod:
  extends: .rdc-deploy
  resource_group: prod
  environment:
    name: prod
  variables:
    RDC_ENV: prod
    RDC_SRC: test

# Add more targets by repeating the pattern above, one job per env, each with
# its own resource_group and RDC_USER_<ENV> / RDC_PASS_<ENV> variables. If your
# repo has its own tests (linters, pytest, ...), gate the buttons on them with
#   needs: ["<your-test-job>"]
# so a deploy cannot run against a snapshot that failed validation.
